[project]
name = "podcast-coach"
version = "0.1.0"
description = ""
authors = [
    {name = "nktrudik"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "openai (>=2.41.1,<3.0.0)",
    "yt-dlp[default] (>=2026.6.9,<2027.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "streamlit (>=1.58.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.17,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]
