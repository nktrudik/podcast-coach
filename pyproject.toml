[project]
name = "podcast-coach"
version = "0.1.0"
description = "English Interview Coach for IT"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "nktrudik" }]
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "openai==2.41.1",
    "yt-dlp[default]==2026.6.9",
    "pydantic-settings==2.14.1",
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "ruff==0.15.17",
    "mypy==2.1.0",
    "bandit==1.9.4",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ANN", "RUF"]
ignore = [
    "ANN401",
    "S101"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = [".venv", "frontend/node_modules", "tests"]
