services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
      # If YOUTUBE_COOKIES_FILE is set to a relative filename, mount that local file
      # into /app/secrets so cookies are not baked into the Docker image.
      - type: bind
        source: ./${YOUTUBE_COOKIES_FILE:-.env.example}
        target: /app/secrets/${YOUTUBE_COOKIES_FILE:-unused_cookies_placeholder}
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      FRONTEND_BACKEND_BASE_URL: http://backend:8000
      FRONTEND_REQUEST_TIMEOUT_SECONDS: ${FRONTEND_REQUEST_TIMEOUT_SECONDS:-180}
