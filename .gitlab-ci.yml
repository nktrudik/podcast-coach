stages:
  - quality
  - build

backend_quality:
  stage: quality
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
  script:
    - ruff format --check .
    - ruff check .
    - mypy .
    - bandit -r .
    - pytest

frontend_build:
  stage: quality
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build

build_backend:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f Dockerfile.backend -t podcast-coach-backend:$CI_COMMIT_SHORT_SHA .

build_frontend:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f Dockerfile.frontend -t podcast-coach-frontend:$CI_COMMIT_SHORT_SHA .
